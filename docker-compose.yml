services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: corsica
      POSTGRES_PASSWORD: corsica
      POSTGRES_USER: corsica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corsica -d corsica"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
